[project]
name = "live-depth"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch>=2.10.0",
    "torchvision>=0.20.0",
    "timm",
    "einops",
    "omegaconf",
    "numpy",
    "scipy",
    "scikit-image",
    "opencv-contrib-python-headless",
    "imageio",
    "pyyaml",
    "open3d==0.19.0; platform_machine == 'x86_64'",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [
    { index = "jetson",  marker = "platform_machine == 'aarch64'" },
    { index = "pytorch", marker = "platform_machine == 'x86_64'" },
]
torchvision = [
    { index = "jetson",  marker = "platform_machine == 'aarch64'" },
    { index = "pytorch", marker = "platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "jetson"
url  = "https://pypi.jetson-ai-lab.io/jp6/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch"
url  = "https://download.pytorch.org/whl/cu126"
explicit = true
