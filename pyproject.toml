[project]
name = "live-depth"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # inference
    "torch",
    "torchvision",
    "timm",
    "einops",
    "omegaconf",
    # vision / data
    "numpy",
    "scipy",
    "scikit-image",
    "opencv-contrib-python-headless",
    "imageio",
    "pyyaml",
]

# torch + torchvision come from NVIDIA's Jetson wheel index on Jetson;
# on x86 they fall through to PyPI automatically.
[tool.uv.sources]
torch      = { index = "jetson" }
torchvision = { index = "jetson" }

[[tool.uv.index]]
name     = "jetson"
url      = "https://pypi.jetson-ai-lab.io/jp6/cu126"
explicit = true
